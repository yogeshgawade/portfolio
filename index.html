    <script>
      // Set theme before first paint to avoid a flash. Dark is the default.
      (function () {
        var d = document.documentElement;
        var t = 'dark';
        d.classList.add('js');
        try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
        d.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
